server {
    listen 80;
    server_name bagiin.ardhiqi.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bagiin.ardhiqi.com;

    # TANPA auth_basic - guest perlu akses via share link

    ssl_certificate     /etc/letsencrypt/live/bagiin.ardhiqi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagiin.ardhiqi.com/privkey.pem;
    include conf.d/ssl.conf;
    include conf.d/security-headers.conf;

    client_max_body_size 12m;

    # Sejak v1 penuh: berkas UI dilayani nginx dari hasil build React,
    # /api/ dan /uploads/ ke satu backend v1 (8096) yang memegang DB produksi.
    # Backend 0.9 (8082) tidak lagi menerima lalu lintas; konfigurasi lamanya
    # disimpan sebagai bagiin.ardhiqi.com.conf.pre-v1 untuk rollback.
    root /var/www/bagiin-react;
    index index.html;

    # NOTE on `add_header`: an add_header at location level REPLACES the whole
    # inherited set, so every location that declares one re-includes
    # security-headers.conf.

    # `.webmanifest` tidak ada di mime.types; blok `types {}` di level server
    # MENGGANTI seluruh peta MIME bawaan, jadi MIME diatur per-lokasi.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache: dialah yang menunjuk berkas ber-hash.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include conf.d/security-headers.conf;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include conf.d/security-headers.conf;
    }

    # API per-user: jangan pernah disimpan.
    location /api/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, max-age=0";
        include conf.d/security-headers.conf;
    }

    # Aset identitas (favicon, ikon, manifest, og-cover) TIDAK boleh immutable.
    # Dengan `expires 1y; immutable`, logo baru tidak akan pernah muncul:
    # browser dan Cloudflare menyimpan versi lama sampai setahun. Aset ini
    # berubah atas kehendak kita, bukan hanya saat build --hash baru.
    location ~* ^/(favicon\.(?:svg|ico)|icon-[0-9a-z-]+\.png|manifest\.webmanifest|og-cover\.png)$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        include conf.d/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include conf.d/security-headers.conf;
        try_files $uri =404;
    }

    # SPA: /rekap, /b/<id>, /buat semuanya index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
