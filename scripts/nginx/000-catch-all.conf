# Catch-all: hostname yang tidak punya vhost sendiri ditutup (444), bukan
# dilayani situs lain. Tanpa ini nginx memakai server block pertama yang
# kebetulan terbaca, sehingga domain lama bisa diam-diam menampilkan produk
# yang salah.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/bagiin.ardhiqi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagiin.ardhiqi.com/privkey.pem;
    return 444;
}
