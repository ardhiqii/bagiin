<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAFA">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/static/v31/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/v31/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/static/v31/icon-180.png">
<title>Bagiin</title>
<style>
:root {
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F4F4F5;
  --border:#E4E4E7; --border-strong:#D4D4D8;
  --text:#18181B; --text-2:#52525B; --text-3:#A1A1AA;
  --accent:#F97316; --accent-press:#EA580C; --on-accent:#FFFFFF;
  --green:#16A34A; --green-bg:#F0FDF4; --red:#DC2626; --red-bg:#FEF2F2;
  --orange-bg:#FFF7ED; --orange-border:#F97316;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shadow-1:0 1px 2px rgba(24,24,27,.04);
  --shadow-2:0 1px 3px rgba(24,24,27,.06),0 1px 2px rgba(24,24,27,.03);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#18181B; --surface:#27272A; --surface-2:#3F3F46;
    --border:#3F3F46; --border-strong:#52525B;
    --text:#FAFAFA; --text-2:#D4D4D8; --text-3:#71717A;
    --orange-bg:#431407;
    --green:#4ADE80; --green-bg:#052E16; --red:#F87171; --red-bg:#450A0A;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 1px 3px rgba(0,0,0,.5);
  }
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { font-family:system-ui,-apple-system,"SF Pro Text",Roboto,"Segoe UI",Arial,sans-serif;
       background:var(--bg); color:var(--text); min-height:100dvh; }
.money { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; letter-spacing:-0.01em; }
#app { max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 96px); }
.hidden { display:none !important; }

/* Header */
.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.brand { font-size:18px; font-weight:700; letter-spacing:-0.02em; }
.brand .dot { color:var(--accent); }
.topbar .right { display:flex; gap:8px; align-items:center; }

/* Cards */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
        padding:16px; margin-bottom:12px; box-shadow:var(--shadow-1); }
.card-title { font-size:14px; color:var(--text-2); margin-bottom:8px; font-weight:500; }
.hero-total { font-size:32px; font-weight:800; letter-spacing:-0.02em; line-height:1.1; }
.label-sm { font-size:12px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }

/* Item rows */
.item-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.item-row:last-child { border-bottom:none; }
.item-check { width:24px; height:24px; border:2px solid var(--border-strong); border-radius:6px;
              flex-shrink:0; display:flex; align-items:center; justify-content:center;
              color:var(--on-accent); font-size:14px; transition:background .1s,border-color .1s; }
.item-row.selected .item-check { background:var(--accent); border-color:var(--accent); }
.item-row.selected { background:var(--orange-bg); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:var(--r-md); }
.item-info { flex:1; min-width:0; }
.item-name { font-size:15px; font-weight:500; }
.item-share { font-size:12px; color:var(--text-3); margin-top:2px; }
.item-price { font-size:15px; font-weight:600; }
.item-row.pressed .item-check { transform:scale(0.92); }

/* Sticky bottom bar */
.sticky-bar { position:fixed; bottom:0; left:0; right:0; z-index:50;
              background:var(--surface); border-top:1px solid var(--border);
              padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
              box-shadow:var(--shadow-2); }
.sticky-inner { max-width:560px; margin:0 auto; display:flex; align-items:center; gap:12px; }
.sticky-total { flex:1; }
.sticky-total .money { font-size:20px; font-weight:700; }
.sticky-total .label { font-size:12px; color:var(--text-3); }

/* Buttons */
button { font:inherit; border:none; border-radius:var(--r-md); cursor:pointer; -webkit-user-select:none; user-select:none; }
button:active { transform:scale(0.98); }
.btn-primary { background:var(--accent); color:var(--on-accent); padding:14px 20px; font-weight:600;
               width:100%; font-size:16px; min-height:48px; }
.btn-primary:active { background:var(--accent-press); }
.btn-primary:disabled { opacity:.5; }
.btn-outline { background:var(--surface); color:var(--text); border:1px solid var(--border);
               padding:12px 16px; font-weight:500; min-height:44px; }
.btn-ghost { background:transparent; color:var(--text-2); padding:12px 16px; font-weight:500; min-height:44px; }
.btn-green { background:var(--green); color:#fff; padding:14px 20px; font-weight:600; width:100%; font-size:16px; min-height:48px; }
.btn-sm { padding:8px 12px; font-size:13px; font-weight:500; }
.btn-icon { width:44px; height:44px; display:flex; align-items:center; justify-content:center;
            background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); font-size:18px; }

/* Chips / status */
.chip { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; }
.chip-green { background:var(--green-bg); color:var(--green); }
.chip-red { background:var(--red-bg); color:var(--red); }
.chip-grey { background:var(--surface-2); color:var(--text-2); }
.slot-badge { font-size:10px; font-weight:700; background:var(--orange-bg); color:var(--accent); border:1px solid var(--orange-border);
              border-radius:999px; padding:2px 6px; vertical-align:middle; text-transform:uppercase; letter-spacing:0.02em; }
.chip-active { outline:2px solid var(--accent); outline-offset:-1px; font-weight:700; }
.chip-btn { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600;
            border:1px solid var(--border); background:var(--surface-2); color:var(--text-2); cursor:pointer; }

/* Forms */
label { font-size:14px; color:var(--text-2); display:block; margin-bottom:4px; font-weight:500; }
input, select { font:inherit; padding:12px; border:1px solid var(--border); border-radius:var(--r-sm);
                background:var(--surface); color:var(--text); width:100%; }
input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
.field { margin-bottom:12px; }
.field-row { display:flex; gap:8px; }
.field-row > * { flex:1; }

/* Segmented tabs */
.seg { display:flex; background:var(--surface-2); border-radius:var(--r-md); padding:3px; margin-bottom:16px; }
.seg button { flex:1; padding:10px; border-radius:8px; font-weight:500; font-size:14px; background:transparent; color:var(--text-2); }
.seg button.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }

/* People list */
.person-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.person-row:last-child { border-bottom:none; }
.avatar { width:36px; height:36px; border-radius:50%; background:var(--surface-2); color:var(--text-2);
          display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0; }
.person-info { flex:1; min-width:0; }
.person-name { font-size:15px; font-weight:500; }
.person-sub { font-size:12px; color:var(--text-3); margin-top:2px; }
.person-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.person-total { font-size:15px; font-weight:700; }
.person-remove { width:32px; height:32px; border-radius:8px; background:var(--red-bg); color:var(--red);
                 display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; cursor:pointer; }
.person-remove:active { transform:scale(0.94); }

/* Consolidated attention card */
.warn-card { background:var(--orange-bg); border:1px solid var(--orange-border); border-radius:var(--r-md);
             padding:12px 14px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px; }
.warn-row { display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--text); line-height:1.4; }
.warn-row .warn-icon { flex-shrink:0; font-size:14px; margin-top:1px; }

/* Pay sheet: tappable item list */
.pay-item { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; cursor:pointer; }
.pay-item:last-child { border-bottom:none; }
.pay-item:active { opacity:.6; }
.pay-item-x { width:26px; height:26px; border-radius:8px; background:var(--red-bg); color:var(--red);
              display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }

/* Confirm sheet breakdown rows */
.break-row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:4px 0; font-size:13px; }
.break-row .money { font-weight:600; }

/* Toast */
#toast { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 90px); left:50%; transform:translateX(-50%);
         background:var(--text); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px;
         z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90%; text-align:center; }
#toast.show { opacity:1; }

/* Bottom sheet */
.sheet-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--surface); border-radius:var(--r-lg) var(--r-lg) 0 0; width:100%; max-width:560px;
         padding:20px 16px calc(env(safe-area-inset-bottom) + 20px); max-height:85dvh; overflow-y:auto;
         animation:sheetUp .2s ease-out; }
@keyframes sheetUp { from { transform:translateY(40px); opacity:.6; } to { transform:translateY(0); opacity:1; } }
.sheet-handle { width:36px; height:4px; border-radius:2px; background:var(--border-strong); margin:0 auto 16px; }
.sheet-title { font-size:18px; font-weight:700; margin-bottom:12px; }

/* Receipt photo */
.photo-preview { width:100%; border-radius:var(--r-md); border:1px solid var(--border); margin-bottom:12px; cursor:pointer; max-height:240px; object-fit:contain; background:var(--surface-2); }
.photo-preview.expanded { max-height:none; cursor:zoom-out; }
.brand-chip { display:inline-flex; align-items:center; justify-content:center; border-radius:10px; font-weight:700; font-size:11px; min-width:36px; height:36px; padding:0 8px; letter-spacing:.02em; flex-shrink:0; }
.account-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.account-row:last-child { border-bottom:none; }
.code-display { font-size:20px; font-weight:800; letter-spacing:.06em; text-align:center; padding:14px 10px; background:var(--surface-2); border-radius:var(--r-md); font-variant-numeric:tabular-nums; }
.dropzone { border:2px dashed var(--border-strong); border-radius:var(--r-md); padding:24px; text-align:center;
            color:var(--text-2); cursor:pointer; margin-bottom:12px; }
.dropzone:active { background:var(--surface-2); }

/* misc */
.muted { color:var(--text-3); font-size:13px; }
.error-text { color:var(--red); font-size:13px; margin-top:4px; }
.warn-box { background:var(--red-bg); border:1px solid var(--red); color:var(--red); border-radius:var(--r-md);
            padding:12px; font-size:14px; margin-bottom:12px; }
.warn-box ul { margin:8px 0 0 16px; }
.spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent);
           border-radius:50%; display:inline-block; animation:spin .6s linear infinite; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
.history-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.history-row:last-child { border-bottom:none; }
.empty-state { text-align:center; padding:40px 16px; color:var(--text-2); }
.empty-state .big { font-size:40px; margin-bottom:12px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="/static/v31/app.js"></script>
<script src="/static/v31/screens.js"></script>
<script src="/static/v31/bill.js"></script>
<script>render();</script>
</body>
</html>
